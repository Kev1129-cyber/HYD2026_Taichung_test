<title>HYD2026臺中成果</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">
<style>
/* Layout: one reading column; each output is a sheet with its map outline beside the description.
   Same tokens as the map page so the two read as one set. */
:root {
  --bg: #eaefee;
  --surface: #fbfcfc;
  --ink: #15242b;
  --ink-2: #4b5b62;
  --muted: #637278;
  --rule: #d3dcdc;
  --line-vil: #93a3a8;
  --line-admin: #1d3038;
  --accent: #0b6a73;
  --accent-ink: #ffffff;
  --d1: #2a78d6;
  --d2: #eb6834;
  --tint: 20%;

  --font-display: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1416;
    --surface: #141d20;
    --ink: #e4ecec;
    --ink-2: #a8b7ba;
    --muted: #8a9a9e;
    --rule: #263338;
    --line-vil: #4c5f65;
    --line-admin: #d4e0e1;
    --accent: #4fb8c2;
    --accent-ink: #062226;
    --d1: #3987e5;
    --d2: #d95926;
    --tint: 22%;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1416;
  --surface: #141d20;
  --ink: #e4ecec;
  --ink-2: #a8b7ba;
  --muted: #8a9a9e;
  --rule: #263338;
  --line-vil: #4c5f65;
  --line-admin: #d4e0e1;
  --accent: #4fb8c2;
  --accent-ink: #062226;
  --d1: #3987e5;
  --d2: #d95926;
  --tint: 22%;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.7 var(--font-body);
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.page {
  max-width: 980px;
  margin-inline: auto;
  padding-inline: 16px;
  padding-block: 40px 56px;
  display: grid;
  gap: 40px;
}
.page > * { min-width: 0; }

.eyebrow {
  margin: 0;
  font: 500 11px/1.4 var(--font-mono);
  letter-spacing: 0.12em;
  color: var(--muted);
}
h1 {
  margin: 6px 0 0;
  font: 700 clamp(28px, 5vw, 40px)/1.2 var(--font-display);
  letter-spacing: 0.05em;
  text-wrap: balance;
}
.lede { margin: 14px 0 0; max-width: 40em; color: var(--ink-2); }

h2 {
  margin: 0 0 14px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--rule);
  font: 700 14px/1.4 var(--font-body);
  letter-spacing: 0.08em;
  color: var(--ink-2);
}

/* output sheet */
.work {
  display: grid;
  grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr);
  gap: 28px;
  align-items: center;
  padding: 20px;
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: 2px;
}
@media (max-width: 760px) {
  .work { grid-template-columns: 1fr; gap: 18px; padding: 16px; }
}
.thumb-link {
  display: block;
  padding: 10px;
  border: 1px solid var(--line-admin);
  background: var(--bg);
}
.thumb { display: block; width: 100%; height: auto; }
.thumb .v { stroke: var(--line-vil); stroke-width: 0.6; stroke-linejoin: round; }
.thumb .v.d0 { fill: color-mix(in srgb, var(--d1) var(--tint), var(--surface)); }
.thumb .v.d1 { fill: color-mix(in srgb, var(--d2) var(--tint), var(--surface)); }
.thumb .dist { fill: none; stroke: var(--line-admin); stroke-width: 1.4; stroke-linejoin: round; }
.thumb-link:hover .v { stroke: var(--ink-2); }

.kicker { margin: 0; font: 500 11px/1.4 var(--font-mono); letter-spacing: 0.12em; color: var(--muted); }
.work h3 { margin: 4px 0 8px; font: 700 24px/1.3 var(--font-display); letter-spacing: 0.06em; }
.work h3 a { color: var(--ink); text-decoration: none; }
.work h3 a:hover { text-decoration: underline; }
.work p.desc { margin: 0; color: var(--ink-2); }
.facts {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 2px 14px;
  margin: 14px 0 18px;
  font-size: 13px;
}
.facts dt { color: var(--muted); }
.facts dd { margin: 0; }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.btn {
  display: inline-block;
  padding: 9px 18px;
  background: var(--accent);
  color: var(--accent-ink);
  border-radius: 2px;
  font-weight: 500;
  text-decoration: none;
}
.btn:hover { filter: brightness(1.08); }

/* downloads */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th, td { padding: 9px 10px 9px 0; text-align: left; vertical-align: top; border-bottom: 1px solid var(--rule); }
th { font-size: 12px; font-weight: 500; color: var(--muted); }
td.file { min-width: 11em; overflow-wrap: anywhere; }
td.size { white-space: nowrap; text-align: right; padding-right: 0; }
th.size { text-align: right; padding-right: 0; }
td .fmt { margin-left: 6px; font: 11px var(--font-mono); color: var(--muted); }

.sources { margin: 0; padding-left: 1.1em; display: grid; gap: 8px; font-size: 13px; color: var(--ink-2); }
footer { font-size: 12.5px; color: var(--muted); border-top: 1px solid var(--rule); padding-top: 14px; }
footer a { color: inherit; }
</style>

  <section aria-labelledby="h-data">

    <div class="table-wrap">
      <table>

  <footer>
